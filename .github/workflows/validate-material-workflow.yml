name: Validate Material and BOQ Workflow

on:
  push:
    branches: [implementation/material-categories-boq, implementation/order-item-production, implementation/production-bulk, implementation/dispatch-form, implementation/contact-form, implementation/contacts-updated-today, implementation/followup-person-counts, implementation/followup-status-form, implementation/lead-priority-layout, implementation/lead-action-icons, implementation/lead-history-only, implementation/lead-save-list, implementation/lead-tabs-remarks, implementation/crm-tab-counts, implementation/order-form-layout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candelier-material-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: candelier_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test CSV import
        run: |
          node tests/materialCsv.test.mjs
          node tests/contactsCsv.test.mjs
          node tests/enquiry-script.test.cjs

      - name: Test migration and BOQ workflow
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=33306;dbname=candelier_test;charset=utf8mb4
        run: php tests/workflow.php

      - name: Test BOQ and Materials UI
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 > /tmp/candelier-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break || sleep 1; done
          node tests/ui.cjs > /tmp/ui.log 2>&1 && echo "::notice::PASS ui" || echo "::error::FAIL ui: $(tail -c 500 /tmp/ui.log | tr '\n' ' ')"
          node tests/production-ui.cjs > /tmp/production-ui.log 2>&1 && echo "::notice::PASS production-ui" || echo "::error::FAIL production-ui: $(tail -c 500 /tmp/production-ui.log | tr '\n' ' ')"
          node tests/crm-ui.cjs > /tmp/crm-ui.log 2>&1 && echo "::notice::PASS crm-ui" || echo "::error::FAIL crm-ui: $(tail -c 500 /tmp/crm-ui.log | tr '\n' ' ')"
          node tests/enquiries-ui.cjs > /tmp/enquiries-ui.log 2>&1 && echo "::notice::PASS enquiries-ui" || echo "::error::FAIL enquiries-ui: $(tail -c 500 /tmp/enquiries-ui.log | tr '\n' ' ')"
          node tests/operations-ui.cjs > /tmp/operations-ui.log 2>&1 && echo "::notice::PASS operations-ui" || echo "::error::FAIL operations-ui: $(tail -c 500 /tmp/operations-ui.log | tr '\n' ' ')"
          node tests/material-media-ui.cjs > /tmp/material-media-ui.log 2>&1 && echo "::notice::PASS material-media-ui" || echo "::error::FAIL material-media-ui: $(tail -c 500 /tmp/material-media-ui.log | tr '\n' ' ')"
          node tests/permissions-ui.cjs > /tmp/permissions-ui.log 2>&1 && echo "::notice::PASS permissions-ui" || echo "::error::FAIL permissions-ui: $(tail -c 500 /tmp/permissions-ui.log | tr '\n' ' ')"
          node tests/booking-ui.cjs > /tmp/booking-ui.log 2>&1 && echo "::notice::PASS booking-ui" || echo "::error::FAIL booking-ui: $(tail -c 500 /tmp/booking-ui.log | tr '\n' ' ')"
          node tests/whatsapp-ui.cjs > /tmp/whatsapp-ui.log 2>&1 && echo "::notice::PASS whatsapp-ui" || echo "::error::FAIL whatsapp-ui: $(tail -c 500 /tmp/whatsapp-ui.log | tr '\n' ' ')"
          node tests/whatsapp-failed-ui.cjs > /tmp/whatsapp-failed-ui.log 2>&1 && echo "::notice::PASS whatsapp-failed-ui" || echo "::error::FAIL whatsapp-failed-ui: $(tail -c 500 /tmp/whatsapp-failed-ui.log | tr '\n' ' ')"
          node tests/whatsapp-templates-ui.cjs > /tmp/whatsapp-templates-ui.log 2>&1 && echo "::notice::PASS whatsapp-templates-ui" || echo "::error::FAIL whatsapp-templates-ui: $(tail -c 500 /tmp/whatsapp-templates-ui.log | tr '\n' ' ')"
